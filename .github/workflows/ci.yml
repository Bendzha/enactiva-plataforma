name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se sube un commit nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valores de prueba compartidos por todos los jobs. Las bases se crean y se destruyen en cada
# corrida, así que estos secretos no protegen nada: los reales nunca se versionan (ADR-0003).
env:
  NODE_ENV: test
  JWT_ACCESS_SECRET: secreto-de-ci-sin-valor-real-0123456789
  REFRESH_TOKEN_PEPPER: pepper-de-ci-sin-valor-real-0123456789
  INTERNO_SECRETO: secreto-interno-de-ci-sin-valor-real-0123456789
  SEED_ADMIN_EMAIL: admin.ci@plataforma.local
  SEED_ADMIN_PASSWORD: clave-de-ci-larga-123

jobs:
  # ── Lo que no toca la base de datos ────────────────────────────────────────
  # Va solo y sin servicios: arranca en segundos, y un error de formato o de tipos se ve sin
  # esperar a que levanten Postgres y Mailpit.
  calidad:
    name: Lint, formato, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Que nadie agregue un workspace con tests y se olvide de correrlos aquí: no correrían
      # nunca y CI seguiría en verde, que es peor que no tener CI.
      - name: Ningún workspace con tests queda fuera de CI
        run: node tools/ci/cobertura-de-ci.mjs

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ── Tests de lo que no necesita base ───────────────────────────────────────
  front_y_paquetes:
    name: Tests · web y paquetes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # `pnpm test` en la raíz los construye primero; aquí, que se filtra por workspace, hay que
      # pedirlo a mano: la web y los servicios importan `@enactiva/shared` ya compilado.
      - name: Construir los paquetes compartidos
        run: pnpm build:paquetes

      - name: Tests
        run: pnpm --filter web --filter @enactiva/shared --filter @enactiva/service-kit test

  # ── Un job por servicio (ADR-0007) ─────────────────────────────────────────
  # Cada uno con su propio Postgres y su propio Mailpit. Así los e2e dejan de compartir base
  # —que es la razón de `--workspace-concurrency=1` en local— y corren de verdad en paralelo;
  # y cuando algo se rompe, la pestaña de Actions dice de qué servicio es sin abrir el log.
  servicios:
    name: Tests · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Que falle uno no cancela a los demás: en un PR conviene ver todo lo que se rompió y no
      # solo lo primero.
      fail-fast: false
      matrix:
        servicio:
          - identity-service
          - auth-service
          - learning-service
          - matching-service
          - api-gateway

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: enactiva
          POSTGRES_PASSWORD: enactiva
          POSTGRES_DB: plataforma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enactiva -d plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Captura los correos que manda la plataforma; los tests verifican que llegaron.
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Base de mantenimiento: ningún servicio la usa, solo sirve para crear las demás.
      DATABASE_URL: postgresql://enactiva:enactiva@localhost:5432/plataforma
      # Una base por microservicio (ADR-0007). Las crea el mismo script que se usa en local,
      # para que CI y el PC de cada uno no se separen.
      DATABASE_URL_IDENTITY: postgresql://svc_identity:identity@localhost:5432/identity_db
      DATABASE_URL_LEARNING: postgresql://svc_learning:learning@localhost:5432/learning_db
      DATABASE_URL_MATCHING: postgresql://svc_matching:matching@localhost:5432/matching_db
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Construir los paquetes compartidos
        run: pnpm build:paquetes

      - name: Crear las bases de los microservicios
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/00-bases.sql

      # Las tres, en todos los jobs. Un servicio no toca la base de otro, pero sus e2e sí
      # levantan a los demás en el mismo proceso —auth arranca identity, el gateway arranca los
      # tres— y adivinar cuáles hacen falta se desincroniza al primer test nuevo.
      - name: Migrar las tres bases
        run: |
          pnpm --filter identity-service db:deploy
          pnpm --filter learning-service db:deploy
          pnpm --filter matching-service db:deploy

      - name: Sembrar el Admin Principal
        run: pnpm --filter identity-service db:seed

      - name: Tests
        run: pnpm --filter ${{ matrix.servicio }} test

  # Un único check que mirar en la protección de rama: verde solo si lo están todos los de
  # arriba. Sin esto habría que marcar siete jobs a mano cada vez que la matriz cambia.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [calidad, front_y_paquetes, servicios]
    if: always()
    steps:
      - name: Resultado
        run: |
          echo "calidad:          ${{ needs.calidad.result }}"
          echo "front_y_paquetes: ${{ needs.front_y_paquetes.result }}"
          echo "servicios:        ${{ needs.servicios.result }}"
          test "${{ needs.calidad.result }}" = success \
            && test "${{ needs.front_y_paquetes.result }}" = success \
            && test "${{ needs.servicios.result }}" = success
