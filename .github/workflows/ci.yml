name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si se sube un commit nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: enactiva
          POSTGRES_PASSWORD: enactiva
          POSTGRES_DB: plataforma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enactiva -d plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Captura los correos que envía la API; los tests verifican que llegaron.
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      # Base de mantenimiento: ningún servicio la usa, solo sirve para crear las demás.
      DATABASE_URL: postgresql://enactiva:enactiva@localhost:5432/plataforma
      # Una base por microservicio (ADR-0007). Las crea el mismo script que se usa en local,
      # para que CI y el PC de cada uno no se separen.
      DATABASE_URL_IDENTITY: postgresql://svc_identity:identity@localhost:5432/identity_db
      DATABASE_URL_LEARNING: postgresql://svc_learning:learning@localhost:5432/learning_db
      DATABASE_URL_MATCHING: postgresql://svc_matching:matching@localhost:5432/matching_db
      # Valores de prueba: esta base se crea y se destruye en cada corrida.
      # Los secretos reales nunca se versionan (ADR-0003).
      JWT_ACCESS_SECRET: secreto-de-ci-sin-valor-real-0123456789
      REFRESH_TOKEN_PEPPER: pepper-de-ci-sin-valor-real-0123456789
      INTERNO_SECRETO: secreto-interno-de-ci-sin-valor-real-0123456789
      SEED_ADMIN_EMAIL: admin.ci@plataforma.local
      SEED_ADMIN_PASSWORD: clave-de-ci-larga-123
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Crear las bases de los microservicios
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/00-bases.sql

      - name: Aplicar migraciones
        run: pnpm --filter identity-service db:deploy

      - name: Sembrar el Admin Principal
        run: pnpm --filter identity-service db:seed

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
